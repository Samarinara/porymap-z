name: Build Porymap-Z
permissions:
  contents: write

on:
  push:
    branches:
    - master
    - dev
    tags:
    - '*'
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-linux:
    strategy:
     # Report every Qt version instead of cancelling the rest after one failure.
     fail-fast: false
     matrix:
       qtversion: [5.14.2, 6.8.*]
    runs-on: ubuntu-latest
    env:
      # Real-project checks run against these upstream revisions. Bump them
      # deliberately so a decomp format change shows up as its own commit.
      POKEEMERALD_REF: 9103e529c2fbdd7add4a1ff3350c6c1f92112c42
      POKEFIRERED_REF: ce6406d8c2eaf46d543c8a2606de0c3cb1951982
      EXPANSION_REF: fc4cb0b2a8abfc407f756306149cff7084a3afa0
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qtversion }}
          modules: 'qtcharts'
          cache: 'true'

      - name: Fetch decomp projects
        run: |
          decomps="$RUNNER_TEMP/decomps"
          fetch() {
            git init -q "$decomps/$1"
            git -C "$decomps/$1" fetch -q --depth 1 "https://github.com/$2" "$3"
            git -C "$decomps/$1" checkout -q FETCH_HEAD
          }
          fetch pokeemerald pret/pokeemerald "$POKEEMERALD_REF"
          fetch pokefirered pret/pokefirered "$POKEFIRERED_REF"
          fetch pokeemerald-expansion rh-hideout/pokeemerald-expansion "$EXPANSION_REF"
          make -C "$decomps/pokeemerald-expansion/tools/trainerproc"
          mkdir "$decomps/corpus"
          ln -s ../pokeemerald "$decomps/corpus/emerald"
          ln -s ../pokefirered "$decomps/corpus/firered"
          # Tests that write files get their own copies.
          cp -r "$decomps/pokeemerald" "$decomps/pokeemerald-trainers"
          cp "$decomps/pokeemerald-expansion/src/data/trainers.party" "$decomps/trainers.party"
          {
            echo "PORYMAP_Z_TEST_PROJECT=$decomps/pokeemerald"
            echo "PORYMAP_SCRIPT_TEST_PROJECT=$decomps/pokeemerald-expansion"
            echo "PORYMAP_Z_TRAINER_PROJECT=$decomps/pokeemerald-trainers"
            echo "PORYMAP_Z_BATTLE_CORPUS=$decomps/corpus"
            echo "PORYMAP_Z_EXPANSION_PROJECT=$decomps/pokeemerald-expansion"
            echo "PORYMAP_Z_EXPANSION_CORPUS=$decomps/trainers.party"
            echo "PORYMAP_Z_TRAINERPROC=$decomps/pokeemerald-expansion/tools/trainerproc/trainerproc"
          } >> "$GITHUB_ENV"

      # Builds the app and every test suite, then runs them all.
      - name: Build and test
        run: tests/porymapz/run_tests.sh build/ci

  build-macos:
    strategy:
     matrix:
       os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # We need a separate step to expand matrix.os
      - name: Set Build Name
        run: echo "BUILD_NAME=porymap-z-${{ matrix.os }}" >> $GITHUB_ENV

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # 6.10 is the first Qt version (by release date) to support macOS 26
          version: '6.10.*'
          modules: 'qtcharts'
          cache: 'true'

      - name: Configure
        run: qmake -config release porymap-z.pro

      - name: Compile
        run: make -j8

      - name: Create Disk Image
        if: startsWith(github.ref, 'refs/tags/')
        run: macdeployqt porymap-z.app -dmg

      - name: Prep Release Directory
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir ${{ env.BUILD_NAME }}
          cp porymap-z.dmg ${{ env.BUILD_NAME }}/porymap-z.dmg
          cp RELEASE-README.txt ${{ env.BUILD_NAME }}/README.txt

      - name: Bundle Release Directory
        if: startsWith(github.ref, 'refs/tags/')
        run: zip -r ${{ env.BUILD_NAME }}.zip ${{ env.BUILD_NAME }}

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.BUILD_NAME }}.zip
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-static-windows:
    if: false  # Windows job is currently disabled; it's failing to find required modules in the Qt build
    runs-on: windows-latest
    env:
      BUILD_NAME: porymap-z-windows
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      
      - uses: dsaltares/fetch-gh-release-asset@master
        if: steps.cache-static-qt.outputs.cache-hit != 'true'
        with:
          repo: 'huderlem/porymap'
          version: 'tags/qt-static-6.9.0-windows'
          file: 'Qt-Static-Windows-mingw-6.9.0.zip'
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Unzip Static Qt
        if: steps.cache-static-qt.outputs.cache-hit != 'true'
        run: powershell.exe -Command "Expand-Archive -Path Qt-Static-Windows-mingw-6.9.0.zip -DestinationPath ../Qt"
      
      - uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: 'huderlem/porymap'
          version: 'tags/qt-static-6.9.0-windows'
          file: 'mingw1310_64.zip'
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Unzip mingw
        run: powershell.exe -Command "Expand-Archive -Path mingw1310_64.zip -DestinationPath ../mingw1310_64"
      
      - name: Add Qt Static to PATH
        run: echo "$env:GITHUB_WORKSPACE/../Qt/6.9.0/bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Add static config to .pro file
        run: echo "CONFIG += qt static" >> porymap.pro
      
      - name: Add static qmake flags to .pro file
        run: echo "QMAKE_LFLAGS += -static-libgcc -static-libstdc++ -static -lwinpthread" >> porymap.pro

      - name: Run Qmake
        env:
          QTDIR: ../Qt/6.9.0
          QMAKESPEC: ${{ github.workspace }}/../Qt/6.9.0/mkspecs/win32-g++
        run: |
          dir $env:GITHUB_WORKSPACE/../Qt/6.9.0/mkspecs
          qmake.exe -o Makefile porymap-z.pro "CONFIG+=qtquickcompiler"

      - name: Add mingw to PATH
        run: echo "$env:GITHUB_WORKSPACE/../mingw1310_64/bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Compile
        env:
          QTDIR: ../Qt/6.9.0
        run: mingw32-make.exe -j8
      
      - name: Prep Release Directory
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir $BUILD_NAME
          cp release/porymap-z.exe $BUILD_NAME/porymap-z.exe
          cp RELEASE-README.txt $BUILD_NAME/README.txt
      
      - name: Bundle Release Directory
        if: startsWith(github.ref, 'refs/tags/')
        run: powershell.exe -Command "Compress-Archive -Path $BUILD_NAME -DestinationPath $BUILD_NAME.zip"
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: $BUILD_NAME.zip
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
